name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/document-capabilities-ZqH7q

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Download Tesseract language data (Greek + English)
        run: |
          mkdir -p android/app/src/main/assets/tessdata
          curl -fL -o android/app/src/main/assets/tessdata/ell.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/ell.traineddata
          curl -fL -o android/app/src/main/assets/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          ls -la android/app/src/main/assets/tessdata/

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DocScanner.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DocScanner v1.0.${{ github.run_number }}
          body: |
            Download **DocScanner.apk** below and install it on your Android phone.

            Tap the APK file link to download, then open it on your phone to install.
          files: DocScanner.apk
          make_latest: true
